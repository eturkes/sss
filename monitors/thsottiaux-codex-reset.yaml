version: 1
id: thsottiaux-codex-reset
name: Tibo · Codex usage-reset hints
enabled: true
schedule: { every: 5m }
source:
  type: x
  handle: thsottiaux
  maxPages: 30
assertions:
  minItems: 1
  maxItems: 500
  requiredFields: [author, postId, text, url]
  uniqueBy: postId
rules:
  - id: reset-hint
    type: llm_assessment
    trigger: new_item
    bootstrap: suppress_existing
    model: gpt-6.1-sol
    reasoningEffort: xhigh
    prompt: >-
      Favor recall: a missed reset costs more than a false alarm. Set suggestive
      true for any plausible Codex allowance-reset signal, including an upcoming,
      same-day, rolling-out, or just-completed reset. Resolve uncertainty about
      the target, timing, or seriousness in favor of alerting when a reset
      interpretation remains plausible. A positive judgment is an interpretation,
      not a confirmed reset schedule.

      Trusted monitor context: this source is Tibo (@thsottiaux), whose reset
      announcements this monitor follows for Codex usage allowances. Interpret
      his unqualified reset/refill announcements and recurring day-numbered
      reset posts in that context. The post need not repeat Codex, usage, limits,
      or allowances. An adjacent announcement, access reminder, or incident
      discussion does not cancel an otherwise plausible allowance-reset signal.

      Consider explicit statements, veiled humor, teasing, emojis, metaphors,
      irony, wordplay, and supplied parent/quoted conversation. A short reply
      can signal a reset through that context. Attribute parent/quoted statements
      to their authors; judge whether Tibo's own response plausibly hints at or
      confirms the reset. Accept fresh confirmations even when phrased in the
      past tense. Reserve suggestive false for clearly unrelated conversation,
      product news without a reset signal, clearly software/context-only resets,
      clearly routine individual renewals, clearly other-product-only resets,
      or clearly historical resets without current relevance. Explain ambiguity
      and cite exact observed snippets. Use the trusted source context rather
      than requiring unavailable evidence or an explicit promise.
notifications:
  - type: inbox
  - type: email
    events: [llm_assessment]
    account: gmail
    from: emir.turkes@eturkes.com
    to: emir.turkes@eturkes.com
health: { failuresBeforeAlert: 3 }
