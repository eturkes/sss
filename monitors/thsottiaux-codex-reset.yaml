version: 1
id: thsottiaux-codex-reset
name: Tibo · Codex usage-reset hints
enabled: true
schedule: { every: 5m }
source:
  type: x
  handle: thsottiaux
  maxPages: 30
assertions:
  minItems: 1
  maxItems: 500
  requiredFields: [author, postId, text, url]
  uniqueBy: postId
rules:
  - id: reset-hint
    type: llm_assessment
    bootstrap: suppress_existing
    model: gpt-6.1-sol
    reasoningEffort: xhigh
    prompt: >-
      Assess whether this authored post or reply suggests an incoming reset of
      Codex usage limits or allowances, including a reset currently rolling out.
      Consider veiled humor, teasing, emojis, metaphors, irony, wordplay, and the
      supplied parent/quoted conversation. Interpret context as context, not as
      an independent statement by this author. Give a suggestive judgment when
      the observation supports a plausible reset hint; an explicit promise is
      unnecessary. Distinguish ordinary conversation, unrelated product news,
      software/context resets, scheduled individual quota renewals, and purely
      past resets. Explain the inference and cite exact observed snippets.
      Treat the result as an interpretation, never as a confirmed reset schedule.
notifications:
  - type: inbox
  - type: email
    events: [llm_assessment]
    account: gmail
    from: emir.turkes@eturkes.com
    to: emir.turkes@eturkes.com
health: { failuresBeforeAlert: 3 }
