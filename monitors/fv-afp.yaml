version: 1
id: fv-afp
name: Formal verification · Archive of Formal Proofs
enabled: true
schedule:
  cron: 15 * * * *
  timezone: Asia/Tokyo
source:
  type: feed
  url: https://isa-afp.org/index.xml
assertions:
  allowEmpty: true
  requiredFields:
    - title
    - url
rules:
  - id: new-observations
    type: new_items
    bootstrap: suppress_existing
notifications:
  - type: inbox
  - type: email
    account: gmail
    from: emiru.tarukesu@gmail.com
    to: emiru.tarukesu@gmail.com
    digest:
      id: formal-verification
      schedule:
        cron: 0 9 * * *
        timezone: Asia/Tokyo
health:
  failuresBeforeAlert: 3
