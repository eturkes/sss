version: 1
id: fv-sel4-news
name: Formal verification · seL4 news
enabled: true
schedule:
  cron: 15 * * * *
  timezone: Asia/Tokyo
source:
  type: sel4_news
assertions:
  minItems: 1
  requiredFields:
    - title
    - url
    - publishedAt
    - summary
rules:
  - id: new-observations
    type: new_items
    bootstrap: suppress_existing
notifications:
  - type: inbox
  - type: email
    account: gmail
    from: emiru.tarukesu@gmail.com
    to: emiru.tarukesu@gmail.com
    digest:
      id: formal-verification
      schedule:
        cron: 0 9 * * *
        timezone: Asia/Tokyo
health:
  failuresBeforeAlert: 3
