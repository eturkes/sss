version: 1
id: authenticated-fare
name: Authenticated flight quote
enabled: false
schedule:
  every: 4h
source:
  type: browseros
  url: https://travel.example.com/search
  fields:
    price:
      selector: .total-price
      type: money
      currency: USD
    itinerary:
      selector: .itinerary-summary
assertions:
  minItems: 1
  maxItems: 1
  requiredFields: [price, itinerary]
  invariantFields: [itinerary]
rules:
  - id: under-target
    type: crosses_below
    field: price
    thresholdMinor: 90000
    currency: USD
    bootstrap: evaluate_current
notifications:
  - type: inbox
  - type: desktop
health:
  failuresBeforeAlert: 2
